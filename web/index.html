<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Handoff — Move your Mezo loan</title>
<meta name="description" content="Switch wallets while keeping the same Bitcoin collateral. Move a Mezo MUSD loan in one transaction." />
<link rel="icon" href="assets/handoff-icon.png" />
<script>
  /* Applied before first paint so a light-mode visitor never sees a dark flash. */
  (function(){try{
    var p = localStorage.getItem("handoff-theme") || "system";
    var dark = p === "dark" || (p === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  }catch(e){}})();
</script>
<style>
:root{
  color-scheme: light;
  font-family:"Geist","Geist Variable",system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
  --bg:#f2f1ea;
  --panel:#ffffff;
  --rule:#e3e0d4;
  --rule-strong:#cdc9b9;
  --ink:#14140f;
  --muted:#6c6a5f;
  --faint:#8e8b7e;
  --forest:#1e3a2c;
  --forest-deep:#14281e;
  --forest-panel:#173425;
  --on-forest:#f3f1e8;
  --on-forest-muted:#b3bfb5;
  --on-forest-line:#3d5a49;
  --amber:#e9a35c;
  --amber-deep:#c98a45;
  --on-amber:#16140c;
  --tint:#f0eee4;
  --btn:#1e3a2c;
  --btn-hover:#162c21;
  --on-btn:#f6f4ec;
  --danger:#a24a32;
  --danger-bg:#faeee9;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  --gutter:clamp(20px,5vw,80px);
}

/* Dark — the same structure, inverted. Evergreen becomes the page, panels go near-black. */
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0f120f;
  --panel:#171b16;
  --rule:#2a312a;
  --rule-strong:#3b453b;
  --ink:#eeece1;
  --muted:#9b9d90;
  --faint:#767a6d;
  --forest:#16281e;
  --forest-deep:#101d15;
  --forest-panel:#16301f;
  --on-forest:#f0eee3;
  --on-forest-muted:#a9b7aa;
  --on-forest-line:#3a5644;
  --amber:#e9a35c;
  --amber-deep:#b87f3f;
  --on-amber:#16140c;
  --tint:#1e231d;
  --btn:#2d5c43;
  --btn-hover:#376f51;
  --on-btn:#f6f4ec;
  --danger:#e0937c;
  --danger-bg:#231713;
}

*{box-sizing:border-box}
html{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3,p,ol,dl,dd,figure{margin:0}
button,input{font:inherit}
button{cursor:pointer;color:inherit}
button:disabled{cursor:default}
a{color:inherit}
code{font-family:var(--mono)}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
#step-title:focus,#page-title:focus,#workspace:focus{outline:none}

.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.skip-link{position:fixed;z-index:9;inset:10px auto auto 10px;padding:10px 15px;background:var(--forest);color:var(--on-forest);font-weight:650;transform:translateY(-180%);text-decoration:none}
.skip-link:focus{transform:translateY(0)}

/* ---------------- header ---------------- */
.topbar{border-bottom:1px solid var(--rule)}
.top-inner{width:min(1400px,calc(100% - 2*var(--gutter)));margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:86px}
.brand{display:flex;align-items:center;gap:12px;padding:0;border:0;background:none;font-size:25px;font-weight:750;letter-spacing:-.025em}
.brand img{flex:none;width:34px;height:34px;border-radius:8px}
.top-actions{display:flex;align-items:center;gap:10px}
.mode-control{display:flex;border:1px solid var(--rule-strong);background:var(--panel)}
.mode-control button{min-height:38px;padding:0 22px;border:0;border-left:1px solid var(--rule-strong);background:transparent;color:var(--muted);font-size:13.5px;font-weight:600}
.mode-control button:first-child{border-left:0}
.mode-control button[aria-pressed="true"]{color:var(--ink);background:var(--tint);font-weight:680}
.mode-control button:hover:not(:disabled):not([aria-pressed="true"]){color:var(--ink)}
.wallet-button{display:inline-flex;align-items:center;gap:9px}
.wallet-indicator{width:7px;height:7px;border-radius:50%;border:1px solid var(--faint);flex:none}
.wallet-indicator.connected{border-color:#5f8f5c;background:#5f8f5c}
.theme-toggle{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;padding:0;border:1px solid var(--rule-strong);background:var(--panel);color:var(--muted)}
.theme-toggle:hover:not(:disabled){color:var(--ink);border-color:var(--faint)}
.theme-toggle svg{width:15px;height:15px;display:block}

/* ---------------- page ---------------- */
.workspace{width:min(1400px,calc(100% - 2*var(--gutter)));margin-inline:auto;padding:clamp(28px,4vw,54px) 0 34px}
.intro h1{font-size:clamp(34px,4.6vw,54px);font-weight:730;letter-spacing:-.035em;line-height:1.04}
.intro p{margin-top:14px;color:var(--muted);font-size:clamp(14px,1.5vw,16px)}

.layout{display:grid;grid-template-columns:minmax(150px,186px) minmax(0,1fr) minmax(280px,432px);gap:clamp(16px,2.4vw,30px);align-items:start;margin-top:clamp(24px,3vw,38px)}

/* ---------------- vertical step rail ---------------- */
.stepper ol{list-style:none;margin:0;padding:0;display:grid}
.stepper li{display:flex;align-items:center;gap:12px;min-height:58px;padding:0 16px;border-bottom:1px solid var(--rule);color:var(--faint);font-size:14px;font-weight:560}
.stepper li:first-child{border-top:1px solid var(--rule)}
.step-index{font:600 11.5px/1 var(--mono);color:var(--faint);letter-spacing:.02em}
.stepper li.current{color:var(--ink);font-weight:700;background:var(--tint);border-left:3px solid var(--forest);padding-left:13px}
.stepper li.complete{color:var(--muted)}
.stepper li.complete .step-index{color:var(--forest)}
:root[data-theme="dark"] .stepper li.current{border-left-color:var(--amber)}
:root[data-theme="dark"] .stepper li.complete .step-index{color:var(--amber)}
:root[data-theme="dark"] .stepper li.current .step-index{color:var(--ink)}

/* ---------------- work panel ---------------- */
.work-panel{background:var(--panel);border:1px solid var(--rule);padding:clamp(20px,2.6vw,34px) clamp(18px,2.6vw,32px)}
.step-head{margin-bottom:clamp(20px,2.4vw,30px)}
.step-head h2{font-size:clamp(23px,2.6vw,31px);font-weight:720;letter-spacing:-.028em;line-height:1.12}
.step-head > p{margin-top:10px;color:var(--muted);font-size:14.5px;line-height:1.5;max-width:56ch}
.step-head .notice{margin-top:16px}

/* ---------------- wallet route ---------------- */
.route{margin-bottom:clamp(18px,2vw,26px)}
.route-line{display:flex;align-items:center;height:12px}
.route-node{width:8px;height:8px;border:1.5px solid var(--faint);background:transparent;flex:none}
.route-node.route-end{border-color:var(--amber-deep);background:var(--amber)}
.route-arrow{flex:1 1 auto;height:0;border-top:1px solid var(--rule-strong);margin:0 6px;position:relative}
.route-arrow::after{content:"";position:absolute;right:0;top:-4px;width:7px;height:7px;border-top:1px solid var(--rule-strong);border-right:1px solid var(--rule-strong);transform:rotate(45deg)}
.route-ends{display:flex;justify-content:space-between;gap:18px;margin-top:10px}
.route-right{text-align:right}
.route-label{display:block;font-size:12.5px;font-weight:640;color:var(--ink)}
.route-address{display:block;margin-top:7px;font-size:17px;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
.route-note{display:block;margin-top:6px;font-size:12.5px;color:var(--muted)}
.addresses{margin-top:12px}
.addresses summary{cursor:pointer;font-size:12.5px;color:var(--muted);width:fit-content}
.addresses summary:hover{color:var(--ink)}
.addresses dl{margin-top:10px;padding:12px 14px;background:var(--tint)}
.addresses dl > div + div{margin-top:8px}
.addresses dt{font-size:11px;font-weight:620;color:var(--faint);letter-spacing:.03em;text-transform:uppercase}
.addresses dd{margin:3px 0 0;font-size:12px;font-family:var(--mono);overflow-wrap:anywhere}

/* ---------------- compare table ---------------- */
.compare{margin-top:clamp(18px,2vw,26px);border-top:1px solid var(--rule)}
.compare-head,.compare-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);align-items:stretch}
.compare-head{padding:10px 12px 10px 0;font-size:12px;color:var(--faint);font-weight:620}
.compare-head span:not(:first-child){text-align:right;padding-right:12px}
.compare-row{border-top:1px solid var(--rule);font-size:14px}
.compare-row > span{display:flex;align-items:baseline;justify-content:flex-end;gap:0;padding:15px 12px;min-width:0}
.compare-row > span:first-child{justify-content:flex-start;padding-left:0;color:var(--muted);font-weight:600;white-space:normal}
.compare-row > span:not(:first-child){font-weight:680;white-space:nowrap}
.compare-row > span:last-child{background:var(--tint)}
.unit{color:var(--faint);font-size:10.5px;font-weight:600;margin-left:5px;letter-spacing:.02em;white-space:nowrap}

.section-title{font-size:14.5px;font-weight:700;margin-top:clamp(20px,2.2vw,28px)}
.fee-list{margin-top:8px}
.fee-list > div{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
.fee-list > div:last-child{border-bottom:0}
.fee-list dt{color:var(--muted)}
.fee-list dd{font-weight:660;text-align:right}
.footnote{margin-top:12px;padding-top:2px}
.subtle{color:var(--muted);font-size:12.5px;line-height:1.6}

/* ---------------- buttons ---------------- */
.actions{margin-top:clamp(20px,2.2vw,28px);display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.actions.between{justify-content:space-between}
.action-group{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.button{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:44px;padding:10px 20px;border:1px solid var(--rule-strong);background:transparent;color:var(--ink);font-size:13.5px;font-weight:650;white-space:nowrap;text-decoration:none;transition:background-color .13s,border-color .13s,color .13s}
.button:hover:not(:disabled){border-color:var(--faint)}
.button.primary{background:var(--btn);border-color:var(--btn);color:var(--on-btn);font-weight:660}
.button.primary:hover:not(:disabled){background:var(--btn-hover);border-color:var(--btn-hover)}
.button.secondary:hover:not(:disabled){background:var(--tint)}
.button:disabled{opacity:.45;border-color:var(--rule-strong);background:transparent;color:var(--muted)}
.forward-arrow,.external-arrow{position:relative;display:inline-block;width:14px;height:8px;flex:none}
.forward-arrow::before,.external-arrow::before{content:"";position:absolute;inset:50% 0 auto 0;border-top:1.4px solid currentColor}
.forward-arrow::after,.external-arrow::after{content:"";position:absolute;right:0;top:calc(50% - 3px);width:5px;height:5px;border-top:1.4px solid currentColor;border-right:1.4px solid currentColor;transform:rotate(45deg)}
.external-arrow{width:8px;transform:rotate(-45deg);margin-inline:2px}

/* ---------------- fields ---------------- */
.field + .field{margin-top:20px}
.field-line{display:flex;align-items:stretch;gap:10px}
.field-line input{flex:1 1 auto;min-width:0}
label{display:block;margin-bottom:8px;font-size:13px;font-weight:660}
input{min-height:48px;width:100%;padding:11px 14px;border:1px solid var(--rule-strong);background:var(--panel);color:var(--ink);font:400 13px/1.3 var(--mono)}
input::placeholder{color:var(--faint)}
.field .subtle{margin-top:9px}

/* ---------------- evergreen aside ---------------- */
.aside{display:grid;gap:0}
.aside-panel{background:var(--forest-panel);color:var(--on-forest);border-top:4px solid var(--amber);padding:clamp(20px,2.2vw,26px) clamp(18px,2.2vw,24px)}
.aside-panel h2{font-size:16px;font-weight:660;letter-spacing:-.01em}
.aside-figure{display:flex;align-items:baseline;gap:8px;margin-top:clamp(18px,2vw,26px);padding-bottom:clamp(16px,1.8vw,22px)}
.aside-figure strong{font-size:clamp(34px,3.6vw,44px);font-weight:700;letter-spacing:-.04em;line-height:1}
.aside-figure span{font-size:13px;color:var(--on-forest-muted);font-weight:600}
.aside-list{margin:0;border-top:1px solid var(--on-forest-line)}
.aside-list > div{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--on-forest-line)}
.aside-list dt{color:var(--on-forest-muted);font-size:13px}
.aside-list dd{margin:0;font-size:14px;font-weight:660}
.aside-list .unit{color:var(--on-forest-muted)}
.aside-note{margin-top:14px;color:var(--on-forest-muted);font-size:13px;line-height:1.55}
.aside-meta{margin-top:10px;color:var(--on-forest-muted);font-size:11.5px;font-family:var(--mono)}

.aside-details{background:var(--tint);border:1px solid var(--rule);border-top:0}
.aside-details summary{cursor:pointer;list-style:none;padding:15px 20px;font-size:13px;font-weight:650;display:flex;align-items:center;gap:9px}
.aside-details summary::-webkit-details-marker{display:none}
.aside-details summary::before{content:"";width:0;height:0;border-left:4.5px solid currentColor;border-top:3.5px solid transparent;border-bottom:3.5px solid transparent;transition:transform .15s}
.aside-details[open] summary::before{transform:rotate(90deg)}
.aside-details p{padding:0 20px 16px;font-size:12.5px;line-height:1.65;color:var(--muted)}

/* ---------------- approvals ---------------- */
.quote-details,.approval-section{margin-top:clamp(20px,2.2vw,28px)}
.approval-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}
.approval-head .section-title{margin-top:0}
.quote-age{font:500 11.5px/1.4 var(--mono);color:var(--faint)}
.quote-age.expired{color:var(--danger)}
.approvals{margin-top:10px;border-top:1px solid var(--rule)}
.approval{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:66px;padding:10px 0;border-bottom:1px solid var(--rule)}
.approval-wallet{display:grid;grid-template-columns:auto auto;align-items:baseline;justify-content:start;gap:2px 10px}
.approval-label{font-size:13px;font-weight:660}
.approval-wallet code{font-size:12px;color:var(--muted)}
.approval-note{grid-column:1/-1;font-size:12px;color:var(--faint)}
.approval .button{min-height:38px;padding-inline:16px;font-size:12.5px}
.signed{color:#5f8f5c;font-size:12.5px;font-weight:660;white-space:nowrap}

/* ---------------- notices + receipt ---------------- */
.notice{padding:13px 15px;border-left:3px solid var(--amber-deep);background:var(--tint);color:var(--ink);font-size:12.5px;line-height:1.55;overflow-wrap:anywhere}
.notice.warning{border-left-color:var(--danger);background:var(--danger-bg);color:var(--danger)}
.receipt-link{color:var(--forest);font-size:13.5px;font-weight:620;text-underline-offset:3px;overflow-wrap:anywhere}
:root[data-theme="dark"] .receipt-link{color:var(--amber)}
.receipt-link-row{display:flex;align-items:baseline;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:18px}

/* ---------------- footer ---------------- */
footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px 22px;margin-top:clamp(26px,3vw,40px);padding-top:20px;border-top:1px solid var(--rule);color:var(--muted);font-size:12.5px}
.net-label{display:inline-flex;align-items:center;gap:8px}
.net-label i{width:8px;height:8px;background:var(--amber);flex:none}
.footer-links{display:flex;flex-wrap:wrap;align-items:center;gap:10px 26px}
.footer-links a,.link-button{text-decoration:none;color:var(--muted)}
.link-button{padding:0;border:0;background:none;font-size:inherit}
.footer-links a:hover,.link-button:hover:not(:disabled){color:var(--ink)}
.link-button:disabled{opacity:.5}

/* ---------------- dialog ---------------- */
dialog{width:min(460px,calc(100% - 32px));max-height:calc(100% - 32px);margin:auto;padding:26px;border:1px solid var(--rule-strong);background:var(--panel);color:var(--ink);box-shadow:0 24px 60px #00000026}
dialog::backdrop{background:#1c241d99}
.dialog-heading{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dialog-heading h2{font-size:21px;font-weight:720;letter-spacing:-.02em}
.dialog-heading .icon-button{min-height:38px;min-width:38px;padding:4px;font-size:17px}
dialog p{color:var(--muted);font-size:13px;line-height:1.6;margin:12px 0 16px}
dialog form button[type="submit"]{margin-top:10px}
.separator{margin:20px 0;border-top:1px solid var(--rule)}
.dialog-status{margin:10px 0;color:var(--muted);font-size:12.5px;line-height:1.5;overflow-wrap:anywhere}
.text-link{color:var(--forest);font-size:13px;font-weight:620}
:root[data-theme="dark"] .text-link{color:var(--amber)}

/* ---------------- responsive ---------------- */
@media (max-width:1120px){
  .layout{grid-template-columns:minmax(140px,168px) minmax(0,1fr);grid-template-areas:"steps main" "aside aside"}
  .stepper{grid-area:steps}
  .work-panel{grid-area:main}
  .aside{grid-area:aside;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
  .aside-details{border-top:1px solid var(--rule)}
}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr);grid-template-areas:"steps" "main" "aside"}
  .stepper ol{display:flex}
  .stepper li{flex:1 1 0;min-height:52px;border-bottom:2px solid var(--rule);border-top:0;padding:0 10px;justify-content:center;font-size:12.5px;gap:8px}
  .stepper li:first-child{border-top:0}
  .stepper li.current{border-left:0;border-bottom-color:var(--forest);padding-left:10px;background:transparent}
  .aside{grid-template-columns:minmax(0,1fr)}
  .route-ends{flex-direction:column;gap:14px}
  .route-right{text-align:left}
  .compare-head,.compare-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .compare-head span:first-child{display:none}
  .compare-head span:nth-child(2){grid-column:1}
  .compare-row > span:first-child{grid-column:1/-1;padding:14px 0 0;font-size:12.5px}
  .compare-row > span{padding:15px 8px}
  .compare-row > span:first-child{padding-left:0;font-size:12.5px;margin-bottom:0}
  .compare-head span:not(:first-child){padding-right:8px}
}
@media (max-width:620px){
  .top-inner{min-height:66px;gap:8px}
  .brand{font-size:17px;gap:7px;flex:0 0 auto;letter-spacing:-.02em}
  .brand img{width:25px;height:25px}
  .top-actions{gap:5px;flex:0 1 auto;min-width:0}
  .mode-control button{padding:0 7px;min-height:33px;font-size:11.5px}
  .theme-toggle{width:33px;height:33px;flex:none}
  .actions.between .action-group{flex:1 0 100%;justify-content:flex-start}
  .work-panel{padding:20px 16px}
  .field-line{flex-wrap:wrap}
  .field-line .button{width:100%}
  .approval-wallet{grid-template-columns:auto}
  .aside-figure strong{font-size:34px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>

</head>
<body>
<a class="skip-link" href="#workspace">Skip to loan transfer</a>
<div id="app"></div>
<div id="live-status" class="visually-hidden" role="status"></div>

<dialog id="router-dialog" aria-labelledby="router-title">
  <div class="dialog-heading">
    <h2 id="router-title">Set up the router</h2>
    <form method="dialog"><button class="button icon-button" aria-label="Close router settings">×</button></form>
  </div>
  <p>Handoff is deployed on Mezo Testnet. Use the verified address below, or deploy your own copy.</p>
  <form id="router-form">
    <label for="router-address">Existing Handoff router</label>
    <input id="router-address" name="router" placeholder="0x…" autocomplete="off" spellcheck="false" />
    <button class="button secondary" type="submit">Verify and use address</button>
  </form>
  <div class="separator"></div>
  <button class="button primary" data-action="deploy-router" type="button">Deploy with connected wallet</button>
  <p class="subtle" style="margin:10px 0 6px">Deployment uses test BTC for network fees. You can reuse the same router for future moves.</p>
  <div id="router-status" class="dialog-status" role="status"></div>
  <a class="text-link" href="https://faucet.test.mezo.org" target="_blank" rel="noopener noreferrer">Get test BTC <span class="external-arrow" aria-hidden="true"></span></a>
</dialog>

<script>
"use strict";

/* ==========================================================================
   Configuration
   ========================================================================== */
const CONFIG = {
  chainId: 31611,
  chainHex: "0x7b7b",
  rpc: "https://rpc.test.mezo.org",
  explorer: "https://explorer.test.mezo.org",
  router: "0x2d2c1B42a75Cf360Ba3A70Bd6ad3a3C619069762",
  musd: "0x118917a40FAF1CD7a13dB0Ef56C86De7973Ac503",
  sigs: "0xD757e3646AF370b15f32EB557F0F8380Df7D639e",
  troveManager: "0xE47c80e8c23f6B4A1aE41c34837a0599D5D16bb0",
  pool: "0x525F049A4494dA0a6c87E3C4df55f9929765Dc3e",
  gasReserve: 200n * 10n ** 18n,

/* ==========================================================================
   Formatting — Mezo stores the interest rate in basis points (100 = 1.00%).
   ========================================================================== */
function text(v){return String(v ?? "").replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);}
function short(a){return a ? `${a.slice(0,6)}…${a.slice(-4)}` : "—";}
const ONE = 10n ** 18n;
function toNum(w){return Number(w) / 1e18;}
function fmt(v,d=2){return toNum(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});}
function btc(v){return toNum(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:8});}
function rate(v){
  if (v === null || v === undefined) return "—";
  return `${(Number(v) / 100).toFixed(2)}%`;
}
function metric(v,u){return `${text(v)} <span class="unit">${u}</span>`;}
function isDemo(){return state.mode === "demo";}
function same(a,b){return Boolean(a && b && a.toLowerCase() === b.toLowerCase());}
const isAddr = (a) => /^0x[0-9a-fA-F]{40}$/.test(a || "");
function pad32(hex){return hex.replace(/^0x/,"").padStart(64,"0");}
const word = (hex,i) => BigInt("0x" + hex.slice(i*64,(i+1)*64));

/* ==========================================================================
   RPC
   ========================================================================== */
async function rpc(method, params){
  const r = await fetch(CONFIG.rpc,{method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify({jsonrpc:"2.0",id:1,method,params})});
  const j = await r.json();
  if (j.error) throw new Error(j.error.message || "RPC error");
  return j.result;
}
async function call(to, data){
  const res = await rpc("eth_call",[{to,data},"latest"]);
  if (!res || res === "0x") throw new Error("No result from contract");
  return res.slice(2);
}
async function readTrove(addr){
  const [s,c,d,r] = await Promise.all([
    call(CONFIG.troveManager, SEL.getTroveStatus + pad32(addr)),
    call(CONFIG.troveManager, SEL.getTroveColl + pad32(addr)),
    call(CONFIG.troveManager, SEL.getTroveDebt + pad32(addr)),
    call(CONFIG.troveManager, SEL.getTroveInterestRate + pad32(addr))
  ]);
  return {status:Number(BigInt("0x"+s)), coll:BigInt("0x"+c), debt:BigInt("0x"+d), rate:BigInt("0x"+r)};
}
async function previewQuote(src, replacementDebt){
  const raw = await call(state.router, SEL.preview + pad32(src) + replacementDebt.toString(16).padStart(64,"0"));
  return {collateral:word(raw,0), payoff:word(raw,1), principal:word(raw,2), flashFee:word(raw,3), change:word(raw,4)};
}

async function connect(){
  say("");
  if (!window.ethereum){ say("No browser wallet found. Install MetaMask or Rabby, then reload.","warning"); render(); return; }
  try{
    const accts = await window.ethereum.request({method:"eth_requestAccounts"});
    state.active = accts[0];
    state.chain = parseInt(await window.ethereum.request({method:"eth_chainId"}),16);
    if (state.chain !== CONFIG.chainId){
      try{
        await window.ethereum.request({method:"wallet_switchEthereumChain",params:[{chainId:CONFIG.chainHex}]});
      }catch{
        await window.ethereum.request({method:"wallet_addEthereumChain",params:[{
          chainId:CONFIG.chainHex, chainName:"Mezo Testnet",
          nativeCurrency:{name:"BTC",symbol:"BTC",decimals:18},
          rpcUrls:[CONFIG.rpc], blockExplorerUrls:[CONFIG.explorer]
        }]});
      }
      state.chain = parseInt(await window.ethereum.request({method:"eth_chainId"}),16);
    }
    if (!state.source) state.source = state.active;
    say(`Connected ${short(state.active)}.`);
  }catch{
    say("Wallet connection was declined.","warning");
  }
  render();
}

async function findLoan(src, dst){
  say("");
  if (!isAddr(src)){ say("The current wallet address isn't valid. Expected 0x and 40 hex characters.","warning"); render(); return; }
  if (!isAddr(dst)){ say("The new wallet address isn't valid. Expected 0x and 40 hex characters.","warning"); render(); return; }
  if (same(src,dst)){ say("Those are the same wallet. Choose a different new wallet.","warning"); render(); return; }

  state.busy = "quote"; render();
  try{
    const a = await readTrove(src);
    const b = await readTrove(dst);
    if (a.status !== 1) throw new Error("This wallet has no active Mezo loan to move.");
    if (b.status === 1) throw new Error("The new wallet already has an active loan. Mezo allows one per wallet.");

    const payoff = a.debt > CONFIG.gasReserve ? a.debt - CONFIG.gasReserve : 0n;
    const probe = await previewQuote(src, payoff + 300n * ONE);
    const replacementDebt = payoff + probe.flashFee + 10n * ONE;
    const pv = await previewQuote(src, replacementDebt);

    let liveRate = null;
    try{ liveRate = BigInt("0x"+await call(INTEREST_RATE_MANAGER, SEL.interestRate)); }catch{}

    const blockNumber = BigInt(await rpc("eth_blockNumber",[]));
    state.quote = {
      loanDebt:a.debt, loanRate:liveRate, collateral:a.coll, payoff,
      flashFee:pv.flashFee, principal:pv.principal,
      newDebt:replacementDebt, newRate:liveRate, change:pv.change,
      blockNumber, deadline: Math.floor(Date.now()/1000) + 600
    };
    state.destinationSignature = null;
    state.sourceSignature = null;
    state.busy = false;
    goPhase(1);
  }catch(e){
    state.busy = false;
    say(e.message || "Could not read that loan.","warning");
    render();
  }
}

/* --- EIP-712 --- */
function typedData(primaryType, message){
  const types = {
    EIP712Domain:[
      {name:"name",type:"string"},
      {name:"version",type:"string"},
      {name:"chainId",type:"uint256"},
      {name:"verifyingContract",type:"address"}
    ]
  };
  if (primaryType === "CloseTrove"){
    types.CloseTrove = [
      {name:"borrower",type:"address"},{name:"recipient",type:"address"},
      {name:"nonce",type:"uint256"},{name:"deadline",type:"uint256"}
    ];
  } else {
    types.OpenTrove = [
      {name:"assetAmount",type:"uint256"},{name:"debtAmount",type:"uint256"},
      {name:"borrower",type:"address"},{name:"recipient",type:"address"},
      {name:"nonce",type:"uint256"},{name:"deadline",type:"uint256"}
    ];
  }
  return {
    domain:{name:CONFIG.domainName,version:CONFIG.domainVersion,chainId:CONFIG.chainId,verifyingContract:CONFIG.sigs},
    primaryType, types, message
  };
}

async function signFor(which){
  say("");
  if (!window.ethereum){ say("Connect a wallet first.","warning"); render(); return; }
  if (!state.quote){ say("Refresh the quote before signing.","warning"); render(); return; }
  const wants = which === "destination" ? state.destination : state.source;
  if (!same(state.active, wants)){
    say(`Switch your wallet to ${short(wants)} first — that wallet must sign.`,"warning"); render(); return;
  }
  state.busy = which === "destination" ? "sign-destination" : "sign-source";
  render();
  try{
    const nonce = BigInt("0x"+await call(CONFIG.sigs, SEL.getNonce + pad32(wants)));
    const deadline = state.quote.deadline;
    let sig;
    if (which === "destination"){
      sig = await window.ethereum.request({method:"eth_signTypedData_v4",params:[wants,JSON.stringify(typedData("OpenTrove",{
        assetAmount:"0x"+state.quote.collateral.toString(16),
        debtAmount:"0x"+state.quote.newDebt.toString(16),
        borrower:wants, recipient:state.router,
        nonce:"0x"+nonce.toString(16), deadline:"0x"+deadline.toString(16)
      }))]});
      state.destinationSignature = {sig,nonce,deadline};
    } else {
      sig = await window.ethereum.request({method:"eth_signTypedData_v4",params:[wants,JSON.stringify(typedData("CloseTrove",{
        borrower:wants, recipient:state.router,
        nonce:"0x"+nonce.toString(16), deadline:"0x"+deadline.toString(16)
      }))]});
      state.sourceSignature = {sig,nonce,deadline};
    }
    say("Signature recorded.");
  }catch{
    say("Signing was cancelled or rejected.","warning");
  }
  state.busy = false;
  render();
}

async function submitMove(){
  say("");
  if (!state.sourceSignature || !state.destinationSignature){
    say("Both wallets must sign before the move can be submitted.","warning"); render(); return;
  }
  if (!same(state.active, state.source)){
    say(`Switch your wallet to ${short(state.source)} — the current wallet submits.`,"warning"); render(); return;
  }
  const q = state.quote;
  state.busy = "submit"; render();
  try{
    const data = SEL.moveLoan
      + pad32(state.destination)
      + pad32(q.collateral.toString(16))
      + pad32(q.newDebt.toString(16))
      + pad32(q.deadline.toString(16));
    let hash;
    try{
      hash = await window.ethereum.request({method:"eth_sendTransaction",params:[{from:state.source,to:state.router,data}]});
    }catch{
      state.busy = false;
      say("The wallet rejected the transaction, or it would revert. Nothing was moved.","warning");
      render(); return;
    }
    state.hash = hash; state.pending = true; state.busy = false;
    goPhase(2);
    pollReceipt();
  }catch(e){
    state.busy = false;
    say(e.message || "Submission failed.","warning"); render();
  }
}

async function pollReceipt(){
  if (!state.hash) return;
  let rc;
  try{ rc = await rpc("eth_getTransactionReceipt",[state.hash]); }
  catch{ setTimeout(pollReceipt,5000); return; }
  if (!rc){ setTimeout(pollReceipt,4000); return; }
  state.pending = false;
  if (rc.status === "0x1"){
    const q = state.quote;
    state.proof = {
      source:state.source, destination:state.destination,
      payoff:q.payoff, flashFee:q.flashFee, change:q.change,
      collateral:q.collateral, newDebt:q.newDebt, newRate:q.newRate,
      hash:state.hash, block:BigInt(rc.blockNumber)
    };
    say("Confirmed by Mezo.");
  } else {
    say("The transaction reverted. No loan was moved.","warning");
  }
  render();
}

/* ==========================================================================
   Router dialog
   ========================================================================== */
const dialog = document.getElementById("router-dialog");
document.getElementById("router-form").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const v = document.getElementById("router-address").value.trim();
  const st = document.getElementById("router-status");
  if (!isAddr(v)){ st.textContent = "That isn't a valid address."; return; }
  st.textContent = "Checking bytecode…";
  try{
    const code = await rpc("eth_getCode",[v,"latest"]);
    if (!code || code === "0x"){ st.textContent = "No contract at that address on Mezo Testnet."; return; }
    state.router = v; st.textContent = "Router set."; dialog.close(); render();
  }catch(err){ st.textContent = "Could not verify: " + err.message; }
});

/* ==========================================================================
   Events
   ========================================================================== */
app.addEventListener("click", (e)=>{
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  if (a === "demo"){ state.mode="demo"; state.phase=0; state.quote=null; state.notice=""; render(); }
  else if (a === "testnet"){ state.mode="testnet"; state.phase=0; state.quote=null; state.notice=""; render(); }
  else if (a === "home"){ state.phase=0; state.quote=null; state.proof=null; state.notice=""; render(); }
  else if (a === "theme") setTheme(THEME_META[state.theme].next);
  else if (a === "connect") connect();
  else if (a === "demo-review") demoReview();
  else if (a === "demo-complete") demoComplete();
  else if (a === "back"){ state.notice=""; goPhase(0); }
  else if (a === "restart"){ state.phase=0; state.quote=null; state.proof=null; state.hash=null; state.pending=false; state.notice=""; goPhase(0); }
  else if (a === "use-source"){ if (state.active){ state.source = state.active; render(); } else { say("Connect a wallet first.","warning"); render(); } }
  else if (a === "use-destination"){ if (state.active){ state.destination = state.active; render(); } else { say("Connect a wallet first.","warning"); render(); } }
  else if (a === "refresh-quote"){ if (state.source && state.destination) findLoan(state.source, state.destination); }
  else if (a === "sign-destination") signFor("destination");
  else if (a === "sign-source") signFor("source");
  else if (a === "submit") submitMove();
  else if (a === "check-receipt"){ state.busy = true; render(); pollReceipt(); }
  else if (a === "share"){ navigator.clipboard?.writeText(location.href); say("Receipt link copied."); render(); }
  else if (a === "router-settings"){ document.getElementById("router-address").value = state.router || ""; dialog.showModal(); }
  else if (a === "deploy-router"){
    document.getElementById("router-status").textContent =
      "Open web/deploy.html to deploy from your wallet, then paste the address here.";
  }
});

app.addEventListener("submit", (e)=>{
  if (e.target.id === "wallet-form"){
    e.preventDefault();
    state.source = document.getElementById("source").value.trim();
    state.destination = document.getElementById("destination").value.trim();
    findLoan(state.source, state.destination);
  }
});

setInterval(()=>{
  if (state.phase === 1 && !isDemo() && state.quote?.deadline){
    const age = document.querySelector(".quote-age");
    if (age){
      const s = state.quote.deadline - Math.floor(Date.now()/1000);
      age.textContent = clockLabel(s);
      age.classList.toggle("expired", s <= 0);
    }
  }
},1000);

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ()=>{ if (state.theme === "system") applyTheme("system"); });

if (window.ethereum){
  window.ethereum.on?.("accountsChanged",(a)=>{ state.active = a[0] || null; render(); });
  window.ethereum.on?.("chainChanged",(c)=>{ state.chain = parseInt(c,16); render(); });
}

render();
</script>
